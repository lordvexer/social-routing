name: Update Social IP Lists

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: social-routing-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate social.json
        run: npm run update

      - name: Commit and push changes
        shell: bash
        run: |
          if git diff --quiet -- social.json; then
            echo "social.json has no changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add social.json
          git commit -m "chore: update social IP lists"

          for attempt in 1 2 3; do
          git pull --rebase --autostash origin main
            if git push origin HEAD:main; then
              echo "social.json pushed successfully."
              exit 0
            fi

            echo "Push attempt ${attempt} failed; retrying in 5 seconds."
            sleep 5
          done

          echo "Could not push after 3 attempts."
          exit 1
